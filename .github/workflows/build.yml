name: Build

# Every push to main compiles all plugins. For each plugin whose <Version> in its
# .csproj has no GitHub Release yet, the build creates the release
# (<PluginFolder>-v<version>, with <PluginFolder>.zip) and updates repo.json so
# Dalamud on every PC offers the update. To release: bump <Version> and push.
#
# Weekly (and on a manual run) it also re-bundles cactbot's fight timelines into
# Mit Planner. If anything changed, it bumps Mit Planner's version, commits, and the
# same run builds and releases it. (A push made by this workflow can't start another
# run, so the sync has to happen here, before the build.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 2'   # Tuesdays 09:17 UTC, after the usual Monday/patch-day cactbot updates

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The Dalamud SDK compiles against Dalamud's own DLLs, which XIVLauncher
      # normally installs. On the build server we download them instead.
      - name: Download Dalamud dev files
        shell: pwsh
        run: |
          $dest = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath $dest

      - name: Sync cactbot timelines into Mit Planner
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 --filter=blob:none --sparse https://github.com/OverlayPlugin/cactbot.git "$env:RUNNER_TEMP/cactbot"
          git -C "$env:RUNNER_TEMP/cactbot" sparse-checkout set --no-cone 'ui/raidboss/data/**/*.txt' 'ui/raidboss/data/**/*.ts' resources/zone_id.ts LICENSE
          $cactbot = git -C "$env:RUNNER_TEMP/cactbot" log -1 --format='%h %cs'
          python .github/scripts/sync_cactbot.py "$env:RUNNER_TEMP/cactbot" MitPlanner/Timelines/cactbot.zip

          if (-not (git status --porcelain MitPlanner/Timelines/cactbot.zip)) { Write-Host "Timelines unchanged (cactbot $cactbot)"; exit 0 }

          # Bump the last version number (0.8.0.0 -> 0.8.0.1) so Dalamud offers the update.
          $proj = 'MitPlanner/MitPlanner.csproj'
          $text = Get-Content $proj -Raw
          $m = [regex]::Match($text, '<Version>(\d+)\.(\d+)\.(\d+)\.(\d+)</Version>')
          $new = "$($m.Groups[1]).$($m.Groups[2]).$($m.Groups[3]).$([int]$m.Groups[4].Value + 1)"
          $text = $text.Replace($m.Value, "<Version>$new</Version>")
          [IO.File]::WriteAllText((Resolve-Path $proj), $text)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MitPlanner/Timelines/cactbot.zip $proj
          git commit -m "MitPlanner $new`: sync cactbot timelines (cactbot $cactbot)"
          git push origin HEAD:main
          "RELEASE_SHA=$(git rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Sync Teamcraft gear sources into Retainer Gear
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/scripts/sync_gear_sources.py RetainerGear/Data/gear_sources.json
          if (-not (git status --porcelain RetainerGear/Data/gear_sources.json)) { Write-Host "Gear sources unchanged"; exit 0 }
          $proj = 'RetainerGear/RetainerGear.csproj'
          $text = Get-Content $proj -Raw
          $m = [regex]::Match($text, '<Version>(\d+)\.(\d+)\.(\d+)\.(\d+)</Version>')
          $new = "$($m.Groups[1]).$($m.Groups[2]).$($m.Groups[3]).$([int]$m.Groups[4].Value + 1)"
          $text = $text.Replace($m.Value, "<Version>$new</Version>")
          [IO.File]::WriteAllText((Resolve-Path $proj), $text)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add RetainerGear/Data/gear_sources.json $proj
          git commit -m "RetainerGear $new`: sync Teamcraft gear sources"
          git push origin HEAD:main
          "RELEASE_SHA=$(git rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Sync Teamcraft sources into Material Stash's clean-up data
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/scripts/sync_cleanup_sources.py MaterialStash/Data/cleanup_sources.json
          if (-not (git status --porcelain MaterialStash/Data/cleanup_sources.json)) { Write-Host "Clean-up sources unchanged"; exit 0 }
          $proj = 'MaterialStash/MaterialStash.csproj'
          $text = Get-Content $proj -Raw
          $m = [regex]::Match($text, '<Version>(\d+)\.(\d+)\.(\d+)\.(\d+)</Version>')
          $new = "$($m.Groups[1]).$($m.Groups[2]).$($m.Groups[3]).$([int]$m.Groups[4].Value + 1)"
          $text = $text.Replace($m.Value, "<Version>$new</Version>")
          [IO.File]::WriteAllText((Resolve-Path $proj), $text)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add MaterialStash/Data/cleanup_sources.json $proj
          git commit -m "MaterialStash $new`: sync Teamcraft clean-up sources"
          git push origin HEAD:main
          "RELEASE_SHA=$(git rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Build all plugins
        run: dotnet build ffxiv-plugins.slnx -c Release

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse -File -Path . -Include latest.zip,*.json | Where-Object FullName -match '\\bin\\' | ForEach-Object { $_.FullName }

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: '*/bin/Release/**'
          if-no-files-found: error

      - name: Release new plugin versions
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Let us check exit codes ourselves (gh release view returns 1 for "not found").
          $PSNativeCommandUseErrorActionPreference = $false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A timeline sync earlier in this run adds a commit; release that, not the commit we started on.
          $target = if ($env:RELEASE_SHA) { $env:RELEASE_SHA } else { $env:GITHUB_SHA }
          $changed = $false
          foreach ($proj in Get-ChildItem -Path */*.csproj) {
            $plugin = $proj.Directory.Name
            $version = ([xml](Get-Content $proj.FullName)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            if (-not $version) { Write-Host "$plugin has no <Version>; skipping"; continue }
            $tag = "$plugin-v$version"
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { Write-Host "$tag already released"; continue }

            $zip = Get-ChildItem -Recurse -File -Path "$plugin/bin" -Filter latest.zip | Select-Object -First 1
            if (-not $zip) { throw "No latest.zip found for $plugin" }
            Copy-Item $zip.FullName "$plugin.zip"
            gh release create $tag "$plugin.zip" --title "$plugin $version" --notes "$plugin $version" --target $target
            if ($LASTEXITCODE -ne 0) { throw "Release failed for $tag" }

            python .github/scripts/update_repo_json.py $plugin $tag
            if ($LASTEXITCODE -ne 0) { throw "repo.json update failed for $plugin" }
            $changed = $true
          }
          if ($changed) {
            git add repo.json
            git commit -m "repo.json: publish new plugin versions [skip ci]"
            git push origin HEAD:main
          }
          exit 0
