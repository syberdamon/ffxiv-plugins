name: Patch-day launcher test

# Runs tools/patchday/test.ps1 (the patch-day launcher's scenarios) on Windows PowerShell 5.1,
# which is what the PC uses, and checks tools/patch_check.py against the 2026-11-10 patch.
on:
  pull_request:
    paths: ['tools/patchday/**', 'tools/patch_check.py', '.github/workflows/patchday-test.yml', '.github/workflows/patch-check.yml']
  workflow_dispatch:

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scenarios
        shell: powershell
        run: ./tools/patchday/test.ps1

  check-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 2026-11-10 patch, 3 AM ET (should be "safe")
        run: |
          python3 tools/patch_check.py --out /tmp/s.json --work /tmp/pc --repo . \
            --official 15.0.3.9,2026.10.16.0000.0000 --cs-ref 80cb4a7b7e11a6702e2eb8839afd301a918c638e --now 2026-11-10T08:00:00+00:00
          python3 -c "import json; s=json.load(open('/tmp/s.json')); assert s['state']=='safe', s['state']; print('OK', s['summary'])"
      - name: Same patch, 1 AM ET (should be "settling")
        run: |
          python3 tools/patch_check.py --out /tmp/s2.json --work /tmp/pc --repo . \
            --official 15.0.3.9,2026.10.16.0000.0000 --cs-ref 1aaea81f65dd7fbd2e8302fdf947aa077fbf4ff6 --now 2026-11-10T05:00:00+00:00
          python3 -c "import json; s=json.load(open('/tmp/s2.json')); assert s['state']=='settling', s['state']; print('OK', s['summary'])"
      - name: Live check (today)
        run: python3 tools/patch_check.py --out /tmp/live.json --work /tmp/pc --repo . && cat /tmp/live.json | head -c 2000
